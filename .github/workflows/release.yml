# release — release/v<버전> 태그(예: release/v0.2.0)를 푸시하면:
#   version  태그가 src/CozyOrbit.App/CozyOrbit.App.csproj 의 <Version> 과 같은지 확인
#   windows  테스트 → 단일 exe(CozyOrbit.exe, 런타임 포함) zip
#   macos    Cozy Orbit.app zip 두 종 (osx-arm64·osx-x64)
#   release  (환경 ENV_RELEASE) 세 zip 의 이름·크기·sha256 을 담은 update-manifest.json 을 만들어 서명(.sig)하고,
#            zip·매니페스트·서명을 모두 붙인 초안(draft) 릴리스를 만든다.
# 초안을 GitHub 에서 확인한 뒤 "Publish release" 를 눌러야 공개된다. 앱은 GitHub API 의 releases/latest 만 보는데
# 초안·프리릴리스는 거기 나오지 않는다 — Publish 가 배포 스위치.
# 필요한 설정: GitHub Environment ENV_RELEASE (Deployment branches and tags: release/v* 태그만) 의
#   시크릿 UPDATE_SIGNING_KEY (ECDSA P-256 개인 키 PEM, 공개 키는 scripts/update-signing.pub.pem).
# 시크릿·태그 이름은 ${{ }} 로 스크립트에 끼워 넣지 않고 env 로만 넘긴다.
name: release

on:
  push:
    tags: ['release/v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches <Version>
        id: version
        run: |
          csproj=src/CozyOrbit.App/CozyOrbit.App.csproj
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$csproj" | head -1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$csproj 의 <Version> '$version' 이 X.Y.Z 모양이 아니에요"; exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "release/v$version" ]]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 $csproj 버전 release/v$version 이 달라요"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json
      - name: Publish (test + win-x64 zip)
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: artifacts/CozyOrbit-*-win-x64.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json
      # 테스트는 windows 작업이 같은 커밋으로 돌린다
      - name: Publish (.app zips)
        run: bash scripts/publish-mac.sh --skip-tests
      - uses: actions/upload-artifact@v4
        with:
          name: osx
          path: artifacts/CozyOrbit-*-osx-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    environment: ENV_RELEASE
    permissions:
      contents: write
    steps:
      # 서명 키 없이 나간 릴리스는 앱이 무시한다 — 무엇보다 먼저 확인
      - name: Signing key is set
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            echo "::error::환경 ENV_RELEASE 의 시크릿 UPDATE_SIGNING_KEY 가 없어요 (업데이트 매니페스트 서명 키, ECDSA P-256 PEM)"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build and sign update-manifest.json
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: bash scripts/make-update-manifest.sh "$TAG" "$VERSION" dist

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          gh release create "$TAG" \
            "dist/CozyOrbit-$VERSION-win-x64.zip" \
            "dist/CozyOrbit-$VERSION-osx-arm64.zip" \
            "dist/CozyOrbit-$VERSION-osx-x64.zip" \
            dist/update-manifest.json \
            dist/update-manifest.json.sig \
            --draft --verify-tag --title "$TAG" --generate-notes
