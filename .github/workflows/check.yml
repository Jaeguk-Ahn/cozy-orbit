# check — main 푸시·PR 용 검사: Windows·macOS 에서 Release 빌드 후 Core 테스트.
# 같은 PR 에 새 커밋이 오면 진행 중이던 이전 검사는 취소한다 (main 푸시는 커밋마다 결과를 남기려고 취소하지 않는다).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json
      - name: build
        run: dotnet build CozyOrbit.slnx -c Release
      - name: test
        run: dotnet test tests/CozyOrbit.Core.Tests -c Release --no-build
